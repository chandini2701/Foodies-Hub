<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Admin Dashboard</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

.header {
    background: #ff5200;
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    width: 90%;
    margin: 30px auto;
}

.card {
    background: white;
    padding: 25px;
    margin-bottom: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}

h2 {
    color: #333;
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
    color: #444;
}

input,
select {
    width: 100%;
    padding: 10px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    background: #ff5200;
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 5px;
    cursor: pointer;
    margin-right: 10px;
}

button:hover {
    background: #e64a00;
}

.delete-btn {
    background: #d32f2f;
}

.delete-btn:hover {
    background: #b71c1c;
}

.menu-btn {
    display: inline-block;
    background: #ff5200;
    color: white;
    padding: 12px 25px;
    text-decoration: none;
    border-radius: 5px;
}

.menu-btn:hover {
    background: #e64a00;
}

</style>

</head>

<body>

<div class="header">

    <h1>Admin Dashboard</h1>

</div>

<div class="container">

    <!-- ============================= -->
    <!-- MENU MANAGEMENT -->
    <!-- ============================= -->

    <div class="card">

        <h2>Menu Management</h2>

        <a href="MenuServlet" class="menu-btn">
            Manage Menus
        </a>

    </div>


    <!-- ============================= -->
    <!-- ADD RESTAURANT -->
    <!-- ============================= -->

    <div class="card">

        <h2>Add Restaurant</h2>

        <form action="RestaurantServlet" method="post">

            <input type="hidden"
                   name="action"
                   value="add">

            <div class="form-group">

                <label>Restaurant Name</label>

                <input type="text"
                       name="name"
                       required>

            </div>


            <div class="form-group">

                <label>Address</label>

                <input type="text"
                       name="address"
                       required>

            </div>


            <div class="form-group">

                <label>Phone</label>

                <input type="text"
                       name="phone"
                       required>

            </div>


            <div class="form-group">

                <label>Cuisine Type</label>

                <input type="text"
                       name="cuisineType"
                       required>

            </div>


            <div class="form-group">

                <label>Rating</label>

                <input type="number"
                       name="rating"
                       step="0.1"
                       min="0"
                       max="5"
                       required>

            </div>


            <div class="form-group">

                <label>Delivery Time</label>

                <input type="text"
                       name="deliveryTime"
                       placeholder="30 mins"
                       required>

            </div>


            <div class="form-group">

                <label>Image URL</label>

                <input type="text"
                       name="imageUrl"
                       placeholder="Paste restaurant image URL"
                       required>

            </div>


            <div class="form-group">

                <label>Active</label>

                <select name="active">

                    <option value="true">
                        True
                    </option>

                    <option value="false">
                        False
                    </option>

                </select>

            </div>


            <button type="submit">
                Add Restaurant
            </button>

        </form>

    </div>


    <!-- ============================= -->
    <!-- UPDATE RESTAURANT -->
    <!-- ============================= -->

    <div class="card">

        <h2>Update Restaurant</h2>

        <form action="RestaurantServlet" method="post">

            <input type="hidden"
                   name="action"
                   value="update">


            <div class="form-group">

                <label>Restaurant ID</label>

                <input type="number"
                       name="restaurantId"
                       required>

            </div>


            <div class="form-group">

                <label>Restaurant Name</label>

                <input type="text"
                       name="name"
                       required>

            </div>


            <div class="form-group">

                <label>Address</label>

                <input type="text"
                       name="address"
                       required>

            </div>


            <div class="form-group">

                <label>Phone</label>

                <input type="text"
                       name="phone"
                       required>

            </div>


            <div class="form-group">

                <label>Cuisine Type</label>

                <input type="text"
                       name="cuisineType"
                       required>

            </div>


            <div class="form-group">

                <label>Rating</label>

                <input type="number"
                       name="rating"
                       step="0.1"
                       min="0"
                       max="5"
                       required>

            </div>


            <div class="form-group">

                <label>Delivery Time</label>

                <input type="text"
                       name="deliveryTime"
                       required>

            </div>


            <div class="form-group">

                <label>Image URL</label>

                <input type="text"
                       name="imageUrl"
                       placeholder="Paste restaurant image URL"
                       required>

            </div>


            <div class="form-group">

                <label>Active</label>

                <select name="active">

                    <option value="true">
                        True
                    </option>

                    <option value="false">
                        False
                    </option>

                </select>

            </div>


            <button type="submit">
                Update Restaurant
            </button>

        </form>

    </div>


    <!-- ============================= -->
    <!-- DELETE RESTAURANT -->
    <!-- ============================= -->

    <div class="card">

        <h2>Delete Restaurant</h2>

        <form action="RestaurantServlet" method="post">

            <input type="hidden"
                   name="action"
                   value="delete">


            <div class="form-group">

                <label>Restaurant ID</label>

                <input type="number"
                       name="restaurantId"
                       required>

            </div>


            <button type="submit"
                    class="delete-btn">

                Delete Restaurant

            </button>

        </form>

    </div>


    <!-- ============================= -->
    <!-- VIEW RESTAURANTS -->
    <!-- ============================= -->

    <div class="card">

        <h2>Restaurant List</h2>

        <a href="RestaurantServlet"
           class="menu-btn">

            View Restaurants

        </a>

    </div>

</div>

</body>
</html>
